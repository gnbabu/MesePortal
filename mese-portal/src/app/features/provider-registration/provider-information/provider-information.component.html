<div class="card p-4 rounded-3 shadow-sm">
  <h3 class="mb-4 text-left header-h3">Provider Details</h3>

  <div class="card p-4">
    <!-- Top Action Bar -->
    <div class="action-bar">
      <!-- <button type="button" class="btn btn-secondary">
        <i class="bi bi-arrow-left-circle me-1"></i>Previous
      </button> -->
      <button type="button" class="btn btn-next" (click)="goToNext()">
        Next <i class="bi bi-arrow-right-circle ms-1"></i>
      </button>
      <button type="button" class="btn btn-danger">
        <i class="bi bi-x-circle me-1"></i>Cancel
      </button>
      <button type="submit" class="btn btn-success">
        <i class="bi bi-check-circle me-1"></i>Save
      </button>
    </div>

    <div class="row g-4 align-items-start">
      <!-- Left Image (25%) -->
      <div
        class="col-12 col-md-3 d-flex justify-content-center align-items-center"
      >
        <div class="placeholder-image">
          <i class="bi bi-person-badge"></i>
        </div>
      </div>

      <!-- Right Controls (75%) -->
      <div class="col-12 col-md-9">
        <form>
          <div class="mb-4 col-md-6">
            <label class="form-label">Provider Name</label>
            <input
              type="text"
              class="form-control"
              placeholder="Enter provider name"
            />
          </div>

          <div class="mb-4 col-md-6">
            <label class="form-label">Address</label>
            <input
              type="text"
              class="form-control"
              placeholder="Enter address"
            />
          </div>

          <div class="mb-4 col-md-6">
            <label class="form-label">City</label>
            <input type="text" class="form-control" placeholder="Enter city" />
          </div>

          <div class="mb-4 col-md-6">
            <label class="form-label">State</label>
            <input type="text" class="form-control" placeholder="Enter state" />
          </div>

          <div class="mb-4 col-md-6">
            <label class="form-label">Zip Code</label>
            <input
              type="text"
              class="form-control"
              placeholder="Enter zip code"
            />
          </div>

          <div class="mb-4 col-md-6">
            <label class="form-label">Provider Type</label>
            <app-dropdown
              [options]="providerTypes"
              placeholder="Select provider type"
              valueAccessor="id"
              textAccessor="name"
              [(ngModel)]="selectedProviderType"
              name="providerType"
              (selectionChange)="onProviderTypeChange($event)"
            ></app-dropdown>
          </div>

          <div class="mb-4 col-md-6">
            <label class="form-label">Region</label>
            <app-dropdown
              [options]="regions"
              placeholder="Select region"
              valueAccessor="id"
              name="regions"
              textAccessor="name"
              [(ngModel)]="selectedRegion"
              (selectionChange)="onRegionChange($event)"
            ></app-dropdown>
          </div>
        </form>
      </div>
    </div>
    <div class="attachments-section">
      <h4>Attachments</h4>
      <app-data-grid
        [columns]="attachmentColumns"
        [data]="attachments"
        [pagingEnabled]="true"
        [pagingMode]="'client'"
        [sortingMode]="'client'"
        [pageSize]="5"
        noDataMessage="No attachments found"
      >
      </app-data-grid>
    </div>
    <!-- Action Bar -->
    <div class="action-bar mt-4 d-flex justify-content-end gap-2">
      <!-- <button type="button" class="btn btn-secondary">
        <i class="bi bi-arrow-left-circle me-1"></i>Previous
      </button> -->
      <button type="button" class="btn btn-next" (click)="goToNext()">
        Next <i class="bi bi-arrow-right-circle ms-1"></i>
      </button>
      <button type="button" class="btn btn-danger">
        <i class="bi bi-x-circle me-1"></i>Cancel
      </button>
      <button type="submit" class="btn btn-success">
        <i class="bi bi-check-circle me-1"></i>Save
      </button>
    </div>
  </div>
</div>
