<p>left-sidebar works!</p>
<div id="sidebar" [class.active]="sidebarActive">
  <div class="sidebar-header">
    <button class="close-btn" (click)="close.emit()">&times;</button>
  </div>
  <ul class="nav flex-column p-2">
    <li class="nav-item" *ngFor="let menu of menuStore.menus()">
      <a class="nav-link" [routerLink]="[menu.route]">
        <i class="bi me-2" [ngClass]="menu.icon"></i>
        {{ menu.label }}
      </a>
    </li>
  </ul>
</div>
