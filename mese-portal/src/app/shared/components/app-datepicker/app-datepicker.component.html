<div class="input-group datepicker-group">
  <input
    #inputEl
    type="text"
    class="form-control"
    [placeholder]="placeholder"
    (blur)="onTouched()"
  />
  <span #iconEl class="input-group-text calendar-icon" role="button">
    <i class="bi bi-calendar-date"></i>
  </span>
  <button
    class="btn btn-outline-secondary"
    type="button"
    (click)="clearDate()"
    *ngIf="value"
  >
    <i class="bi bi-x-circle"></i>
  </button>
</div>
